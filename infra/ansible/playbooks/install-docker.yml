- name: Install Docker
  hosts: iot_vm
  become: true
  gather_facts: true

  vars:
    docker_user: "ubuntu"
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64

  tasks:
    # ========================================================================
    # 1. INSTALL PREREQUISITES
    # ========================================================================
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    # ========================================================================
    # 2. ADD DOCKER REPOSITORY
    # ========================================================================
    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: ["https://download.docker.com/linux/ubuntu"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures: ["{{ docker_arch_map[ansible_facts.architecture] | default('amd64') }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true

    # ========================================================================
    # 3. INSTALL DOCKER ENGINE
    # ========================================================================
    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # ========================================================================
    # 4. START AND ENABLE DOCKER SERVICE
    # ========================================================================
    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ========================================================================
    # 5. VERIFY DOCKER INSTALLATION
    # ========================================================================
    - name: Verify Docker installation
      ansible.builtin.shell:
        cmd: docker --version && docker compose version
      register: docker_version_check
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version_check.stdout_lines }}"

    # ========================================================================
    # 6. CONFIGURE USER PERMISSIONS
    # ========================================================================
    - name: Verify docker group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      register: user_updated

    # Group membership applies only to NEW sessions: drop the current SSH
    # connection so the post-install check below runs with docker rights.
    - name: Reset SSH connection to pick up docker group membership
      ansible.builtin.meta: reset_connection
      when: user_updated.changed

    # ========================================================================
    # 7. CONFIGURE DOCKER REGISTRY MIRRORS (for stable access)
    # ========================================================================
    - name: Configure Docker registry mirrors
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "registry-mirrors": {{ docker_registry_mirrors | to_json }}
          }
        owner: root
        group: root
        mode: '0644'
      notify: restart docker

    # ========================================================================
    # 8. POST-INSTALLATION CHECKS
    # ========================================================================
    # Authoritative now: connection was reset above, so a failure here
    # means docker truly misbehaves — fail loudly instead of warning.
    - name: Check if Docker can run without sudo
      ansible.builtin.shell:
        cmd: docker ps
      become_user: "{{ docker_user }}"
      register: docker_ps_test
      changed_when: false

  handlers:
    - name: restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
        daemon_reload: yes