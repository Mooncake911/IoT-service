# Composite: Buildx + GHCR login + lowercased owner env.
# Replaces triplicated setup-buildx + docker/login + OWNER_LC blocks
# in ci.yml (build-and-push, tag-unchanged-images) and cd.yml.
# Token comes as input (composite steps cannot read the `secrets`
# context — callers pass ${{ secrets.GITHUB_TOKEN }} via `with:`).
# OWNER_LC is exported via $GITHUB_ENV for later steps in the same job.
name: docker-login-ghcr
description: Set up Docker Buildx and log in to GHCR

inputs:
  token:
    description: GHCR token (pass ${{ secrets.GITHUB_TOKEN }})
    required: true
  username:
    description: GHCR username (pass ${{ github.actor }})
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Export lowercased repo owner
      shell: bash
      run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
      env:
        OWNER: ${{ github.repository_owner }}
