- name: Deploy databases to VM
  hosts: iot_vm
  become: false

  vars:
    # Shared defaults live in group_vars/all.yml — only K8s-mode
    # DB settings stay here.
    vm_internal_ip: "10.10.0.100"

  tasks:
    - include_tasks: deploy-common.yml

    # ========================================================================
    # 5. DEPLOY DATABASES (always — MongoDB + RabbitMQ on VM for K8s mode)
    # ========================================================================
    - name: Pull database images
      ansible.builtin.shell: |
        docker compose --profile db pull
      args:
        chdir: "{{ deploy_dir }}"
      async: 600
      poll: 20
      changed_when: true

    - name: Start databases
      ansible.builtin.shell: |
        docker compose --profile db up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: true

    - name: Wait for MongoDB controller health
      ansible.builtin.shell: |
        docker exec mongodb-controller mongosh --quiet --eval "db.adminCommand('ping')" 2>/dev/null
      register: mongo_health
      until: mongo_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for RabbitMQ health
      ansible.builtin.shell: |
        docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null
      register: rabbit_health
      until: rabbit_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Show running database containers
      ansible.builtin.shell: |
        docker ps --filter "name=mongodb\|rabbitmq" --format "table {{ '{{.Names}}' }}\t{{ '{{.Status}}' }}"
      register: db_containers
      changed_when: false

    - name: Display database containers
      ansible.builtin.debug:
        var: db_containers.stdout_lines

    # ========================================================================
    # 6. FILEBEAT ON VM (observability only, runs natively on iot_vm hosts)
    # ========================================================================
    - name: Get K8s node internal IP for Filebeat
      ansible.builtin.shell: |
        kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
      delegate_to: localhost
      register: k8s_node_ip
      when: enable_observability | bool
      changed_when: false
      failed_when: false

    - name: Configure Filebeat Logstash host
      ansible.builtin.lineinfile:
        path: "{{ deploy_dir }}/.env"
        regexp: "^LOGSTASH_HOST="
        line: "LOGSTASH_HOST={{ k8s_node_ip.stdout }}:30444"
        create: true
        mode: "0600"
      when:
        - enable_observability | bool
        - k8s_node_ip.stdout is defined
        - k8s_node_ip.stdout | length > 0

    - name: Start filebeat on VM
      ansible.builtin.shell: |
        docker compose --profile filebeat up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      when:
        - enable_observability | bool
        - k8s_node_ip.stdout is defined
        - k8s_node_ip.stdout | length > 0

- name: Deploy application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_manifest_dir: "{{ playbook_dir }}/../../../k8s"
    vm_internal_ip: "10.10.0.100"
    rabbitmq_prom_port: "15692"
    # deploy_action, app_version, github_owner, enable_observability,
    # enable_argocd come from group_vars/all.yml / --extra-vars.

  tasks:
    - name: Ensure kubectl is installed
      ansible.builtin.command: kubectl version --client -o json
      register: kubectl_check
      changed_when: false
      failed_when: false

    - name: Fail if kubectl is not installed
      ansible.builtin.fail:
        msg: "kubectl is not installed. Install it before deploying to K8s."
      when: kubectl_check.rc != 0

    # NOTE: workload manifests in k8s/ are applied ONLY by ArgoCD from git
    # (k8s/ root via iot-app Application). The desired image tags are
    # committed to k8s/overlays/* by CI/CD (kustomize-set-image) BEFORE
    # this playbook runs — never kubectl set image here, it would fight
    # ArgoCD selfHeal. This play prepares everything ArgoCD must not
    # own: namespace-adjacent Secrets/ConfigMaps with live values.
    # The no-ArgoCD fallback below (plain mode without GitOps) applies
    # the same local tree directly — tags still come from git,
    # so there is nothing to pin here either.

    # .env is the single source of truth for secrets (VM compose path reads
    # it natively; here we load the same file for the K8s path). To migrate
    # to a real secret manager later (Vault/ExternalSecrets/SOPS), replace
    # only this task — everything below consumes the `dot` fact.
    - name: Check repo .env exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../../.env"
      register: repo_dotenv

    - name: Fail if repo .env is missing
      ansible.builtin.fail:
        msg: "Repo .env not found at {{ playbook_dir }}/../../../.env — it is the single source of truth for secrets."
      when: not repo_dotenv.stat.exists

    - name: Load credentials from repo .env
      ansible.builtin.shell: |
        set -a
        . "{{ playbook_dir }}/../../../.env"
        printf '{"mongo_user":"%s","mongo_pass":"%s","rabbit_user":"%s","rabbit_pass":"%s","grafana_user":"%s","grafana_pass":"%s"}' \
          "$MONGO_USER" "$MONGO_PASS" "$RABBIT_USER" "$RABBIT_PASS" "$GRAFANA_ADMIN_USER" "$GRAFANA_ADMIN_PASSWORD"
      args:
        executable: /bin/bash
      register: dotenv_json
      changed_when: false
      no_log: true

    - name: Set credentials fact
      ansible.builtin.set_fact:
        dot: "{{ dotenv_json.stdout | from_json }}"
      no_log: true

    - name: Create iot-db Secret from repo .env (never committed to git)
      ansible.builtin.shell: |
        kubectl create namespace iot --dry-run=client -o yaml | kubectl apply -f -
        kubectl -n iot create secret generic iot-db \
          --from-literal=MONGO_CONTROLLER_URI='mongodb://{{ dot.mongo_user }}:{{ dot.mongo_pass }}@{{ vm_internal_ip }}:27017/iot_db_controller?authSource=admin' \
          --from-literal=MONGO_ANALYTICS_URI='mongodb://{{ dot.mongo_user }}:{{ dot.mongo_pass }}@{{ vm_internal_ip }}:27018/iot_analytics_db?authSource=admin' \
          --from-literal=MONGO_ALERTS_URI='mongodb://{{ dot.mongo_user }}:{{ dot.mongo_pass }}@{{ vm_internal_ip }}:27019/iot_alerts_db?authSource=admin' \
          --from-literal=RABBIT_HOST='{{ vm_internal_ip }}' \
          --from-literal=RABBIT_USER='{{ dot.rabbit_user }}' \
          --from-literal=RABBIT_PASS='{{ dot.rabbit_pass }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      register: db_secret
      changed_when: true
      no_log: true

    - name: Create Prometheus file_sd targets for external RabbitMQ
      ansible.builtin.shell: |
        kubectl -n iot create configmap prometheus-file-sd \
          --from-literal=rabbitmq.json='[{"targets":["{{ vm_internal_ip }}:{{ rabbitmq_prom_port }}"],"labels":{"app":"rabbitmq"}}]' \
          --dry-run=client -o yaml | kubectl apply -f -
      register: prom_sd
      changed_when: true

    - name: Check metrics-server API (HPA dependency)
      ansible.builtin.shell: |
        kubectl get apiservice v1beta1.metrics.k8s.io -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: metrics_api
      changed_when: false
      failed_when: false

    - name: Apply app workloads with Kustomize (no-ArgoCD mode only)
      ansible.builtin.shell: |
        kubectl apply -k "{{ k8s_manifest_dir }}/"
      register: kubectl_apply
      changed_when: '"configured" in kubectl_apply.stdout or "created" in kubectl_apply.stdout'
      when: not (enable_argocd | bool)

    - name: Fail if metrics-server API is not available
      ansible.builtin.fail:
        msg: "metrics.k8s.io API is not Available. Enable it first (minikube: `minikube addons enable metrics-server`; managed K8s: preinstalled, check `kubectl top nodes`). HPA needs it."
      when: metrics_api.stdout != 'True'

    - name: Apply observability manifests (no-ArgoCD mode only)
      ansible.builtin.shell: |
        kubectl apply -k "{{ k8s_manifest_dir }}/observability/"
      register: observability_apply
      changed_when: '"configured" in observability_apply.stdout or "created" in observability_apply.stdout'
      when:
        - not (enable_argocd | bool)
        - enable_observability | bool

    - name: Sync grafana-admin Secret from repo .env
      ansible.builtin.shell: |
        kubectl -n iot create secret generic grafana-admin \
          --from-literal=admin-user='{{ dot.grafana_user }}' \
          --from-literal=admin-password='{{ dot.grafana_pass }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      register: grafana_secret
      changed_when: true
      no_log: true
      when: enable_observability | bool

    # ============================================================
    # ArgoCD GitOps (opt-in via enable_argocd=true).
    # Installs ArgoCD core once, then ArgoCD owns ALL workload sync
    # from git (Applications in k8s/argocd/). This play only prepares
    # what ArgoCD must not own (Secrets/ConfigMaps with live values)
    # and waits for rollout — no direct workload apply here.
    # ============================================================
    - name: Install ArgoCD core
      ansible.builtin.shell: |
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      register: argocd_install
      changed_when: '"created" in argocd_install.stdout or "configured" in argocd_install.stdout'
      when: enable_argocd | bool

    - name: Wait for ArgoCD server
      ansible.builtin.shell: |
        kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=600s
      changed_when: false
      when: enable_argocd | bool

    - name: Apply ArgoCD app Application
      ansible.builtin.shell: |
        kubectl apply -f "{{ k8s_manifest_dir }}/argocd/iot-app.yaml"
      register: argocd_app
      changed_when: '"created" in argocd_app.stdout or "configured" in argocd_app.stdout'
      when: enable_argocd | bool

    - name: Apply ArgoCD observability Application
      ansible.builtin.shell: |
        kubectl apply -f "{{ k8s_manifest_dir }}/argocd/iot-observability.yaml"
      register: argocd_obs
      changed_when: '"created" in argocd_obs.stdout or "configured" in argocd_obs.stdout'
      when:
        - enable_argocd | bool
        - enable_observability | bool

    - name: Check observability rollout status (observability mode)
      ansible.builtin.shell: |
        kubectl rollout status -n iot {{ item }} --timeout=300s
      loop:
        - statefulset/elasticsearch
        - deployment/logstash
        - deployment/kibana
      when: enable_observability | bool
      changed_when: false
      failed_when: false
      register: rollout_statuses

    - name: Show observability rollout statuses
      ansible.builtin.debug:
        var: rollout_statuses.results | map(attribute='stdout_lines')
      when: enable_observability | bool

    - name: Wait for Elasticsearch pod to be ready (observability mode)
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pod -l app=elasticsearch -n iot --timeout=600s
      when: enable_observability | bool
      changed_when: false

    - name: Wait for Logstash pod to be ready (observability mode)
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pod -l app=logstash -n iot --timeout=600s
      when: enable_observability | bool
      changed_when: false

    - name: Check app workloads rollout status
      ansible.builtin.shell: |
        kubectl rollout status -n iot {{ item }} --timeout=300s
      loop:
        - deployment/iot-controller
        - deployment/iot-analytics
        - deployment/iot-alerts
        - deployment/iot-data-gateway
        - deployment/iot-data-simulator
        - deployment/iot-dashboard-ui
      changed_when: false
      failed_when: false
      register: app_rollouts

    - name: Show app workloads rollout statuses
      ansible.builtin.debug:
        var: app_rollouts.results | map(attribute='stdout_lines')

    - name: Remove completed load-test job leftovers
      ansible.builtin.shell: |
        kubectl delete job -n iot load-test --ignore-not-found
      changed_when: false
      failed_when: false

    - name: Wait for all pods to be ready
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pods --all -n iot --timeout=600s
      register: wait_pods
      changed_when: false

    - name: Show pod status
      ansible.builtin.shell: |
        kubectl get pods -n iot -o wide
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        var: pod_status.stdout_lines