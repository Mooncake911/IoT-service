# ArgoCD Application for IoT workloads (GitOps).
# Source of truth is this git repo (Kustomize root at k8s/).
# On forks change spec.source.repoURL to your repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mooncake911/IoT-service.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: iot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
