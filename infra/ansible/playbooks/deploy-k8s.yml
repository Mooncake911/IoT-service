- name: Deploy databases to VM — Lab 3
  hosts: iot_vm
  become: false

  vars:
    deploy_dir: /home/ubuntu/iot-service
    github_owner: ""
    registry_username: ""
    registry_password: ""
    app_version: "latest"
    deploy_action: "deploy"
    enable_observability: false
    vm_internal_ip: "10.10.0.100"

  tasks:
    - include_tasks: deploy-common.yml

    # ========================================================================
    # 5. DEPLOY DATABASES (always — MongoDB + RabbitMQ on VM for K8s mode)
    # ========================================================================
    - name: Pull database images
      ansible.builtin.shell: |
        docker compose --profile db pull
      args:
        chdir: "{{ deploy_dir }}"
      async: 600
      poll: 20
      changed_when: true

    - name: Start databases
      ansible.builtin.shell: |
        docker compose --profile db up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      changed_when: true

    - name: Wait for MongoDB controller health
      ansible.builtin.shell: |
        docker exec mongodb-controller mongosh --quiet --eval "db.adminCommand('ping')" 2>/dev/null
      register: mongo_health
      until: mongo_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for RabbitMQ health
      ansible.builtin.shell: |
        docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null
      register: rabbit_health
      until: rabbit_health.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Show running database containers
      ansible.builtin.shell: |
        docker ps --filter "name=mongodb\|rabbitmq" --format "table {{ '{{.Names}}' }}\t{{ '{{.Status}}' }}"
      register: db_containers
      changed_when: false

    - name: Display database containers
      ansible.builtin.debug:
        var: db_containers.stdout_lines

    # ========================================================================
    # 6. FILEBEAT ON VM (observability only, runs natively on iot_vm hosts)
    # ========================================================================
    - name: Get K8s node internal IP for Filebeat
      ansible.builtin.shell: |
        kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
      delegate_to: localhost
      register: k8s_node_ip
      when: enable_observability | bool
      changed_when: false
      failed_when: false

    - name: Configure Filebeat Logstash host
      ansible.builtin.lineinfile:
        path: "{{ deploy_dir }}/.env"
        regexp: "^LOGSTASH_HOST="
        line: "LOGSTASH_HOST={{ k8s_node_ip.stdout }}:30444"
        create: true
        mode: "0600"
      when:
        - enable_observability | bool
        - k8s_node_ip.stdout is defined
        - k8s_node_ip.stdout | length > 0

    - name: Start filebeat on VM
      ansible.builtin.shell: |
        docker compose --profile filebeat up -d --remove-orphans
      args:
        chdir: "{{ deploy_dir }}"
      when:
        - enable_observability | bool
        - k8s_node_ip.stdout is defined
        - k8s_node_ip.stdout | length > 0

- name: Deploy application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_manifest_dir: "{{ playbook_dir }}/../../../k8s"
    vm_internal_ip: "10.10.0.100"
    enable_observability: false

  tasks:
    - name: Ensure kubectl is installed
      ansible.builtin.command: kubectl version --client -o json
      register: kubectl_check
      changed_when: false
      failed_when: false

    - name: Fail if kubectl is not installed
      ansible.builtin.fail:
        msg: "kubectl is not installed. Install it before deploying to K8s."
      when: kubectl_check.rc != 0

    - name: Update ConfigMap Mongo hosts with DB VM IP
      ansible.builtin.replace:
        path: "{{ k8s_manifest_dir }}/configmap.yaml"
        regexp: 'mongodb://admin:admin@[^/:]+'
        replace: 'mongodb://admin:admin@{{ vm_internal_ip }}'

    - name: Update RabbitMQ host in ConfigMap
      ansible.builtin.replace:
        path: "{{ k8s_manifest_dir }}/configmap.yaml"
        regexp: 'RABBIT_HOST: .*'
        replace: 'RABBIT_HOST: {{ vm_internal_ip }}'

    - name: Apply namespace and config
      ansible.builtin.shell: |
        kubectl apply -f "{{ k8s_manifest_dir }}/namespace.yaml" \
          -f "{{ k8s_manifest_dir }}/configmap.yaml"
      register: kubectl_base
      changed_when: '"configured" in kubectl_base.stdout or "created" in kubectl_base.stdout'

    - name: Apply app workloads
      ansible.builtin.shell: |
        kubectl apply -R -f "{{ k8s_manifest_dir }}/controller" \
          -f "{{ k8s_manifest_dir }}/analytics" \
          -f "{{ k8s_manifest_dir }}/alerts" \
          -f "{{ k8s_manifest_dir }}/data-gateway" \
          -f "{{ k8s_manifest_dir }}/data-simulator" \
          -f "{{ k8s_manifest_dir }}/dashboard" \
          -f "{{ k8s_manifest_dir }}/hpa.yaml"
      register: kubectl_apply
      changed_when: '"configured" in kubectl_apply.stdout or "created" in kubectl_apply.stdout'

    - name: Apply metrics-server
      ansible.builtin.shell: |
        kubectl apply -f "{{ k8s_manifest_dir }}/metrics-server/components.yaml"
      register: metrics_apply
      changed_when: '"configured" in metrics_apply.stdout or "created" in metrics_apply.stdout'
      failed_when: false

    - name: Wait for metrics API (HPA dependency)
      ansible.builtin.shell: |
        kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=300s
      changed_when: false
      failed_when: false
      register: metrics_api

    - name: Show metrics API status
      ansible.builtin.debug:
        var: metrics_api.stdout_lines

    - name: Apply observability manifests
      ansible.builtin.shell: |
        kubectl apply -R -f "{{ k8s_manifest_dir }}/observability/"
      register: observability_apply
      changed_when: '"configured" in observability_apply.stdout or "created" in observability_apply.stdout'
      when: enable_observability | bool

    - name: Check observability rollout status (observability mode)
      ansible.builtin.shell: |
        kubectl rollout status -n iot {{ item }} --timeout=300s
      loop:
        - statefulset/elasticsearch
        - deployment/logstash
        - deployment/kibana
      when: enable_observability | bool
      changed_when: false
      failed_when: false
      register: rollout_statuses

    - name: Show observability rollout statuses
      ansible.builtin.debug:
        var: rollout_statuses.results | map(attribute='stdout_lines')
      when: enable_observability | bool

    - name: Wait for Elasticsearch pod to be ready (observability mode)
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pod -l app=elasticsearch -n iot --timeout=600s
      when: enable_observability | bool
      changed_when: false

    - name: Wait for Logstash pod to be ready (observability mode)
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pod -l app=logstash -n iot --timeout=600s
      when: enable_observability | bool
      changed_when: false

    - name: Show kubectl apply output
      ansible.builtin.debug:
        var: kubectl_apply.stdout_lines

    - name: Check app workloads rollout status
      ansible.builtin.shell: |
        kubectl rollout status -n iot {{ item }} --timeout=300s
      loop:
        - deployment/iot-controller
        - deployment/iot-analytics
        - deployment/iot-alerts
        - deployment/iot-data-gateway
        - deployment/iot-data-simulator
        - deployment/iot-dashboard-ui
      changed_when: false
      failed_when: false
      register: app_rollouts

    - name: Show app workloads rollout statuses
      ansible.builtin.debug:
        var: app_rollouts.results | map(attribute='stdout_lines')

    - name: Remove completed load-test job leftovers
      ansible.builtin.shell: |
        kubectl delete job -n iot load-test --ignore-not-found
      changed_when: false
      failed_when: false

    - name: Wait for all pods to be ready
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready pods --all -n iot --timeout=600s
      register: wait_pods
      changed_when: false

    - name: Show pod status
      ansible.builtin.shell: |
        kubectl get pods -n iot -o wide
      register: pod_status
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        var: pod_status.stdout_lines