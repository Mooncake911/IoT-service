# Composite: send pipeline status to Telegram via Bot API.
# Credentials come as inputs (composite steps cannot read the `secrets`
# context — callers pass ${{ secrets.* }} via `with:`).
# Silently skips when token/chat-id are empty, so forks without secrets
# keep working.
name: telegram-notify
description: Send workflow status notification to Telegram

inputs:
  status:
    description: Job status to report (success, failure, cancelled)
    required: true
  workflow:
    description: Workflow name for the message title
    required: true
  details:
    description: Extra details line (ref, tag, target, ...)
    required: false
    default: ""
  bot-token:
    description: Telegram bot token (pass ${{ secrets.TELEGRAM_BOT_TOKEN }})
    required: false
    default: ""
  chat-id:
    description: Telegram chat id (pass ${{ secrets.TELEGRAM_CHAT_ID }})
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Send Telegram notification
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
      run: |
        if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
          echo "Telegram secrets not set, skipping notification."
          exit 0
        fi
        case "${{ inputs.status }}" in
          success) ICON="✅" ;;
          failure) ICON="❌" ;;
          *)       ICON="⚠️" ;;
        esac
        TEXT="${ICON} <b>${{ inputs.workflow }}</b>: ${{ inputs.status }}
        ${{ github.repository }} @ ${{ github.sha }}
        ${{ inputs.details }}"
        curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}" > /dev/null
        echo "Telegram notification sent."
