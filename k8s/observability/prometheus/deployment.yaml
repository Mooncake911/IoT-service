apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: iot
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          # Keep in sync with PROMETHEUS_VERSION in .env (compose) — single version policy
          image: prom/prometheus:v2.48.0
          ports:
            - containerPort: 9090
              name: http
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            # Subpath for edge reverse-proxy via dashboard UI (<ui>/prometheus/)
            - '--web.route-prefix=/prometheus/'
            - '--web.external-url=/prometheus/'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: file-sd
              mountPath: /etc/prometheus/file_sd
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: file-sd
          configMap:
            name: prometheus-file-sd
            optional: true
        - name: data
          emptyDir: {}
