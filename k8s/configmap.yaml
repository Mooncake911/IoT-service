apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
  namespace: iot
data:
  # SPRING
  SPRING_SERVER_PORT: "8080"

  # URL-ы для gateway (K8s service discovery)
  ANALYTICS_URL: http://iot-analytics:8080
  ALERTS_URL: http://iot-alerts:8080
  SIMULATOR_URL: http://iot-data-simulator:8080
  CONTROLLER_URL: http://iot-controller:8080

  # Внешние сервисы (MongoDB / RabbitMQ через Docker Compose)
  # IP могут измениться после docker compose down/up — обновить: scripts/update-k8s-ips.sh
  MONGO_CONTROLLER_URI: mongodb://admin:admin@172.19.0.3:27017/iot_db_controller?authSource=admin
  MONGO_ANALYTICS_URI: mongodb://admin:admin@172.19.0.2:27017/iot_analytics_db?authSource=admin
  MONGO_ALERTS_URI: mongodb://admin:admin@172.19.0.4:27017/iot_alerts_db?authSource=admin

  RABBIT_HOST: 172.19.0.5
  RABBIT_MQ_PORT: "5672"
  RABBIT_USER: guest
  RABBIT_PASS: guest

  GATEWAY_HOST: iot-data-gateway

  JAVA_TOOL_OPTIONS: "-Xshare:off -Xmx256m -XX:MaxDirectMemorySize=128m"
  JDK_JAVA_OPTIONS: "--enable-native-access=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal.misc=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED"
