apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-config
  namespace: iot
data:
  # SPRING
  SPRING_SERVER_PORT: "8080"

  # URL-ы для gateway (K8s service discovery)
  ANALYTICS_URL: http://iot-analytics:8080
  ALERTS_URL: http://iot-alerts:8080
  SIMULATOR_URL: http://iot-data-simulator:8080
  CONTROLLER_URL: http://iot-controller:8080

  # NOTE: DB endpoints and credentials live in the `iot-db` Secret
  # (created at deploy time, see deploy-k8s.yml / update-k8s-ips.sh),
  # not here — this file is committed to git.

  RABBIT_MQ_PORT: "5672"

  GATEWAY_HOST: iot-data-gateway

  # Edge reverse-proxy targets for dashboard UI nginx (observability via <ui>/grafana/, <ui>/prometheus/)
  GRAFANA_HOST: grafana
  PROMETHEUS_HOST: prometheus

  JAVA_TOOL_OPTIONS: "-Xshare:off -Xmx256m -XX:MaxDirectMemorySize=128m"
  JDK_JAVA_OPTIONS: "--enable-native-access=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal.misc=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED"
