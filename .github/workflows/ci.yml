name: CI

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**/*.md"
      - ".idea/**"
      - "monitoring/**"
      - "elk/**"
      - "scripts/**"
      - "k8s/**"
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**/*.md"
      - ".idea/**"
      - "monitoring/**"
      - "elk/**"
      - "scripts/**"
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      has_images: ${{ steps.filter.outputs.has_images }}
      image_matrix: ${{ steps.filter.outputs.image_matrix }}
      has_retags: ${{ steps.filter.outputs.has_retags }}
      retag_matrix: ${{ steps.filter.outputs.retag_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect affected areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            all=true
            : > changed-files.txt
          else
            all=false
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$head")"
              fi
            fi
            git diff --name-only "$base" "$head" > changed-files.txt
          fi

          changed() {
            grep -Eq "$1" changed-files.txt
          }

          ci=false
          server=false
          client=false
          infra_only=false
          server_all=false
          dashboard_image=false
          rabbitmq=false
          iot_controller=false
          iot_analytics=false
          iot_alerts=false
          iot_data_gateway=false
          iot_data_simulator=false

          app_changed=false
          if [ "$all" = true ] || changed '^(\.mvn/|mvnw|mvnw\.cmd|pom\.xml$|Dockerfile$|\.dockerignore$|iot-contracts/|iot-controller/|iot-analytics/|iot-alerts/|iot-data-gateway/|iot-data-simulator/|iot-dashboard/)'; then
            app_changed=true
          fi

          if [ "$all" = true ] || changed '^\.github/workflows/ci\.yml$'; then
            ci=true
          fi

          if [ "$all" = true ] || changed '^infra/'; then
            if [ "$all" != true ] && [ "$app_changed" != true ]; then
              infra_only=true
            fi
          fi

          if [ "$ci" = true ] || changed '^(\.mvn/|mvnw|mvnw\.cmd|pom\.xml$|iot-contracts/)'; then
            server=true
            server_all=true
          fi

          if [ "$ci" = true ] || changed '^(Dockerfile|\.dockerignore)$'; then
            server_all=true
          fi

          if [ "$ci" = true ] || changed '^monitoring/rabbitmq/'; then
            server=true
            rabbitmq=true
          fi

          if [ "$ci" = true ] || changed '^iot-controller/'; then
            server=true
            iot_controller=true
          fi
          if [ "$ci" = true ] || changed '^iot-analytics/'; then
            server=true
            iot_analytics=true
          fi
          if [ "$ci" = true ] || changed '^iot-alerts/'; then
            server=true
            iot_alerts=true
          fi
          if [ "$ci" = true ] || changed '^iot-data-gateway/'; then
            server=true
            iot_data_gateway=true
          fi
          if [ "$ci" = true ] || changed '^iot-data-simulator/'; then
            server=true
            iot_data_simulator=true
          fi

          if [ "$ci" = true ] || changed '^iot-dashboard(/|$)'; then
            client=true
            dashboard_image=true
          fi

          export server client server_all dashboard_image infra_only
          export rabbitmq iot_controller iot_analytics iot_alerts iot_data_gateway iot_data_simulator

          python3 - <<'PY'
          import json
          import os

          server_services = [
              ("iot-controller", ".", "./Dockerfile", "iot-controller"),
              ("iot-analytics", ".", "./Dockerfile", "iot-analytics"),
              ("iot-alerts", ".", "./Dockerfile", "iot-alerts"),
              ("iot-data-gateway", ".", "./Dockerfile", "iot-data-gateway"),
              ("iot-data-simulator", ".", "./Dockerfile", "iot-data-simulator"),
              ("iot-rabbitmq", "./monitoring/rabbitmq", "./monitoring/rabbitmq/Dockerfile", "rabbitmq"),
          ]

          service_flags = {
              "iot-controller": "iot_controller",
              "iot-analytics": "iot_analytics",
              "iot-alerts": "iot_alerts",
              "iot-data-gateway": "iot_data_gateway",
              "iot-data-simulator": "iot_data_simulator",
              "iot-rabbitmq": "rabbitmq",
          }

          all_services = [name for name, *_ in server_services] + ["iot-dashboard-ui"]
          infra_only = os.environ.get("infra_only") == "true"

          if infra_only:
              include = []
              retag_include = [{"service": name} for name in all_services]
          else:
              include = []
              if os.environ["server_all"] == "true":
                  selected = [name for name, *_ in server_services]
              else:
                  selected = [
                      name for name, *_ in server_services
                      if os.environ[service_flags[name]] == "true"
                  ]

              for name, context, dockerfile, target in server_services:
                  if name in selected:
                      include.append({
                          "service": name,
                          "context": context,
                          "dockerfile": dockerfile,
                          "target": target,
                      })

              if os.environ["dashboard_image"] == "true":
                  include.append({
                      "service": "iot-dashboard-ui",
                      "context": "./iot-dashboard",
                      "dockerfile": "./iot-dashboard/Dockerfile",
                      "target": "dashboard-ui",
                  })

              selected_services = {item["service"] for item in include}
              retag_include = [
                  {"service": name}
                  for name in all_services
                  if selected_services and name not in selected_services
              ]

          with open("image-matrix.json", "w", encoding="utf-8") as fh:
              json.dump({"include": include}, fh, separators=(",", ":"))
          with open("retag-matrix.json", "w", encoding="utf-8") as fh:
              json.dump({"include": retag_include}, fh, separators=(",", ":"))
          PY

          image_matrix="$(cat image-matrix.json)"
          retag_matrix="$(cat retag-matrix.json)"

          echo "server=$server" >> "$GITHUB_OUTPUT"
           echo "client=$client" >> "$GITHUB_OUTPUT"
          if [ "$image_matrix" = '{"include":[]}' ]; then
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image_matrix=$image_matrix" >> "$GITHUB_OUTPUT"
          if [ "$retag_matrix" = '{"include":[]}' ]; then
            echo "has_retags=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_retags=true" >> "$GITHUB_OUTPUT"
          fi
          echo "retag_matrix=$retag_matrix" >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          sed 's/^/  /' changed-files.txt || true
          echo "infra_only=$infra_only"
          echo "Image matrix: $image_matrix"
          echo "Retag matrix: $retag_matrix"
  # ========================================================================
  #  BUILD JOBS (without tests)
  # ========================================================================

  build-server:
    name: Build Server (Maven)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK with Maven cache
        uses: ./.github/actions/setup-java-maven

      - name: Package (skip tests)
        run: ./mvnw -B -DskipTests package

  build-client:
    name: Build Client (Dashboard)
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js with dependencies
        uses: ./.github/actions/setup-node-dashboard

      - name: Build static files
        working-directory: iot-dashboard
        run: npm run build

  # ========================================================================
  #  TEST JOBS (depend on build)
  # ========================================================================

  test-server:
    name: Test Server
    needs: build-server
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK with Maven cache
        uses: ./.github/actions/setup-java-maven

      # verify runs tests + JaCoCo check (LINE >= 80%, Lab 4 gate:
      # the job fails when coverage is below the threshold)
      - name: Run tests with coverage gate
        run: ./mvnw -B verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: warn

  test-client:
    name: Test Client
    needs: build-client
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js with dependencies
        uses: ./.github/actions/setup-node-dashboard

      - name: Run tests (if present)
        working-directory: iot-dashboard
        run: npm test --if-present

  # ========================================================================
  #  SONARQUBE (Lab 4: static analysis + quality gate, SonarCloud)
  #  Needs SONAR_TOKEN + SONAR_ORGANIZATION + SONAR_PROJECT_KEY repo
  #  secrets. Skips gracefully without a token (e.g. in forks).
  # ========================================================================

  sonar:
    name: SonarQube Scan
    needs:
      - changes
      - test-server
    if: ${{ needs.changes.outputs.server == 'true' && (needs.test-server.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK with Maven cache
        uses: ./.github/actions/setup-java-maven

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || '' }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || '' }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$SONAR_ORGANIZATION" ]; then
            EXTRA_ARGS+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi
          if [ -n "$SONAR_PROJECT_KEY" ]; then
            EXTRA_ARGS+=("-Dsonar.projectKey=$SONAR_PROJECT_KEY")
          fi
          ./mvnw -B -DskipTests sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            "${EXTRA_ARGS[@]}"

      - name: SonarQube quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Sonar skipped (no SONAR_TOKEN)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set, static analysis skipped. JaCoCo 80% gate is still enforced by test-server."

  sonar-dashboard:
    name: SonarQube Scan (dashboard)
    needs:
      - changes
      - test-client
    if: ${{ needs.changes.outputs.client == 'true' && (needs.test-client.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || '' }}
      SONAR_PROJECT_KEY_DASHBOARD: ${{ secrets.SONAR_PROJECT_KEY_DASHBOARD || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js with dependencies
        uses: ./.github/actions/setup-node-dashboard

      - name: Run tests with coverage
        working-directory: iot-dashboard
        run: npm run test:coverage

      - name: Check SonarCloud readiness
        id: readiness
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORGANIZATION" ] && [ -n "$SONAR_PROJECT_KEY_DASHBOARD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SonarCloud scan skipped: set SONAR_TOKEN, SONAR_ORGANIZATION and SONAR_PROJECT_KEY_DASHBOARD secrets."
          fi

      - name: SonarQube scan (dashboard)
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          projectBaseDir: iot-dashboard
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY_DASHBOARD }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*.test.tsx,**/*.test.ts,vite.config.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: SonarQube quality gate (dashboard)
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Sonar skipped (not configured)
        if: ${{ steps.readiness.outputs.ready != 'true' }}
        run: echo "Dashboard static analysis skipped (see readiness check above)."

  # ========================================================================
  #  DOCKER BUILD & PUSH (depends on all build & test jobs)
  # ========================================================================

  build-and-push:
    name: Build & Push Images
    needs:
      - changes
      - build-server
      - test-server
      - sonar
      - build-client
      - test-client
      - sonar-dashboard
    if: ${{ always() && needs.changes.outputs.has_images == 'true' && (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') && (needs.test-server.result == 'success' || needs.test-server.result == 'skipped') && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') && (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') && (needs.test-client.result == 'success' || needs.test-client.result == 'skipped') && (needs.sonar-dashboard.result == 'success' || needs.sonar-dashboard.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-ghcr
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/iot-service/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/iot-service/${{ matrix.service }}:latest

  # ========================================================================
  #  RETAG UNCHANGED IMAGES (if needed)
  # ========================================================================

  tag-unchanged-images:
    name: Tag Unchanged Images
    needs:
      - changes
      - build-and-push
    if: ${{ always() && needs.changes.outputs.has_retags == 'true' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.retag_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: ./.github/actions/docker-login-ghcr
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag unchanged image with current commit SHA
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER_LC }}/iot-service/${{ matrix.service }}:${{ github.sha }} \
            ghcr.io/${{ env.OWNER_LC }}/iot-service/${{ matrix.service }}:latest
  # ========================================================================
  #  TELEGRAM NOTIFICATION (Lab 4: pipeline status bot)
  # ========================================================================

  notify:
    name: Notify via Telegram
    needs:
      - changes
      - build-server
      - test-server
      - sonar
      - build-client
      - test-client
      - sonar-dashboard
      - build-and-push
      - tag-unchanged-images
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Send status to Telegram
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ (needs.build-server.result == 'failure' || needs.test-server.result == 'failure' || needs.sonar.result == 'failure' || needs.build-client.result == 'failure' || needs.test-client.result == 'failure' || needs.sonar-dashboard.result == 'failure' || needs.build-and-push.result == 'failure' || needs.tag-unchanged-images.result == 'failure') && 'failure' || 'success' }}
          workflow: CI
          details: "event=${{ github.event_name }} ref=${{ github.ref_name }}"
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
