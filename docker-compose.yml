# --- ШАБЛОНЫ (ЯКОРЯ) ---

x-base-service: &base-service
  networks:
    - iot-network
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-java-build: &java-build
  context: .
  dockerfile: Dockerfile

x-spring-healthcheck: &spring-healthcheck
  test: [ "CMD-SHELL", "wget -qO- http://localhost:${SPRING_INTERNAL_PORT}/actuator/health | grep -q UP" ]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

x-mongo-healthcheck: &mongo-healthcheck
  test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
  interval: 10s
  timeout: 5s
  retries: 5

x-setup: &setup
  image: curlimages/curl:8.10.1
  command: [ "sh", "/setup/setup.sh" ]
  restart: on-failure

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
  JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS}

x-spring-env: &spring-env
  SPRING_SERVER_PORT: ${SPRING_INTERNAL_PORT}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES}

x-rabbitmq-env: &rabbitmq-env
  RABBIT_USER: ${RABBIT_USER}
  RABBIT_PASS: ${RABBIT_PASS}
  RABBIT_HOST: ${RABBIT_HOST}
  RABBIT_MQ_PORT: ${RABBIT_INTERNAL_MQ_PORT}
  RABBIT_MGMT_PORT: ${RABBIT_INTERNAL_MGMT_PORT}
  RABBIT_STOMP_PORT: ${RABBIT_INTERNAL_STOMP_PORT}
  RABBIT_PROM_PORT: ${RABBIT_INTERNAL_PROM_PORT}

# --- СЕРВИСЫ ---

services:
  iot-data-gateway:
    <<: *base-service
    profiles: [ "core" ]
    build:
      <<: *java-build
      target: iot-data-gateway
      args:
        SERVICE_NAME: iot-data-gateway
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-data-gateway:${TAG}
    container_name: iot-data-gateway
    ports:
      - "${GATEWAY_PORT}:${SPRING_INTERNAL_PORT}"
    environment:
      <<: [ *java-env, *spring-env ]
      ANALYTICS_URL: http://iot-analytics:${SPRING_INTERNAL_PORT}
      ALERTS_URL: http://iot-alerts:${SPRING_INTERNAL_PORT}
      SIMULATOR_URL: http://iot-data-simulator:${SPRING_INTERNAL_PORT}
      CONTROLLER_URL: http://iot-controller:${SPRING_INTERNAL_PORT}
    healthcheck: *spring-healthcheck
    depends_on:
      iot-controller:
        condition: service_healthy
      iot-analytics:
        condition: service_healthy
      iot-alerts:
        condition: service_healthy
      iot-data-simulator:
        condition: service_healthy

  iot-analytics:
    <<: *base-service
    profiles: [ "core" ]
    build:
      <<: *java-build
      target: iot-analytics
      args:
        SERVICE_NAME: iot-analytics
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-analytics:${TAG}
    container_name: iot-analytics
    ports:
      - "${ANALYTICS_PORT}:${SPRING_INTERNAL_PORT}"
    environment:
      <<: [ *java-env, *spring-env, *rabbitmq-env ]
      MONGO_ANALYTICS_URI: ${MONGO_ANALYTICS_URI}
    healthcheck: *spring-healthcheck
    depends_on:
      mongodb-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-controller:
    <<: *base-service
    profiles: [ "core" ]
    build:
      <<: *java-build
      target: iot-controller
      args:
        SERVICE_NAME: iot-controller
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-controller:${TAG}
    container_name: iot-controller
    ports:
      - "${CONTROLLER_PORT}:${SPRING_INTERNAL_PORT}"
    environment:
      <<: [ *java-env, *spring-env, *rabbitmq-env ]
      MONGO_CONTROLLER_URI: ${MONGO_CONTROLLER_URI}
    healthcheck: *spring-healthcheck
    depends_on:
      mongodb-controller:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-alerts:
    <<: *base-service
    profiles: [ "core" ]
    build:
      <<: *java-build
      target: iot-alerts
      args:
        SERVICE_NAME: iot-alerts
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-alerts:${TAG}
    container_name: iot-alerts
    ports:
      - "${ALERTS_PORT}:${SPRING_INTERNAL_PORT}"
    environment:
      <<: [ *java-env, *spring-env, *rabbitmq-env ]
      MONGO_ALERTS_URI: ${MONGO_ALERTS_URI}
    healthcheck: *spring-healthcheck
    depends_on:
      mongodb-alerts:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-data-simulator:
    <<: *base-service
    profiles: [ "core" ]
    build:
      <<: *java-build
      target: iot-data-simulator
      args:
        SERVICE_NAME: iot-data-simulator
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-data-simulator:${TAG}
    container_name: iot-data-simulator
    ports:
      - "${SIMULATOR_PORT}:${SPRING_INTERNAL_PORT}"
    environment:
      <<: [ *java-env, *spring-env ]
      CONTROLLER_URL: http://iot-controller:${SPRING_INTERNAL_PORT}/api/ingest
    healthcheck: *spring-healthcheck
    depends_on:
      iot-controller:
        condition: service_healthy

  iot-dashboard-ui:
    <<: *base-service
    profiles: [ "core" ]
    build:
      context: ./iot-dashboard
      dockerfile: Dockerfile
      target: dashboard-ui
      args:
        VITE_GATEWAY_URL: ""
        SPRING_INTERNAL_PORT: ${SPRING_INTERNAL_PORT}
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-dashboard-ui:${TAG}
    container_name: iot-dashboard-ui
    environment:
      SPRING_INTERNAL_PORT: ${SPRING_INTERNAL_PORT}
      GATEWAY_HOST: iot-data-gateway
      GRAFANA_HOST: grafana
      PROMETHEUS_HOST: prometheus
    ports:
      - "${DASHBOARD_UI_PORT}:${SPRING_INTERNAL_PORT}"
    depends_on:
      iot-data-gateway:
        condition: service_healthy

  # --- ИНФРАСТРУКТУРА ---

  mongodb-controller:
    <<: *base-service
    profiles: [ "core", "db" ]
    image: mongo:${MONGO_VERSION}
    container_name: mongodb-controller
    ports:
      - "${MONGO_CONTROLLER_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_CONTROLLER_DB}
    volumes:
      - mongo_controller_data:/data/db
    command: [ "--wiredTigerCacheSizeGB", "${MONGO_CACHE_SIZE}" ]
    healthcheck: *mongo-healthcheck

  mongodb-analytics:
    <<: *base-service
    profiles: [ "core", "db" ]
    image: mongo:${MONGO_VERSION}
    container_name: mongodb-analytics
    ports:
      - "${MONGO_ANALYTICS_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_ANALYTICS_DB}
    volumes:
      - mongo_analytics_data:/data/db
    command: [ "--wiredTigerCacheSizeGB", "${MONGO_CACHE_SIZE}" ]
    healthcheck: *mongo-healthcheck

  mongodb-alerts:
    <<: *base-service
    profiles: [ "core", "db" ]
    image: mongo:${MONGO_VERSION}
    container_name: mongodb-alerts
    ports:
      - "${MONGO_ALERTS_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_ALERTS_DB}
    volumes:
      - mongo_alerts_data:/data/db
    command: [ "--wiredTigerCacheSizeGB", "${MONGO_CACHE_SIZE}" ]
    healthcheck: *mongo-healthcheck

  rabbitmq:
    <<: *base-service
    profiles: [ "core", "db" ]
    build:
      context: ./monitoring/rabbitmq
      args:
        RABBITMQ_VERSION: ${RABBIT_VERSION}
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/iot-rabbitmq:${TAG}
    container_name: rabbitmq
    ports:
      - "${RABBIT_MQ_PORT}:${RABBIT_INTERNAL_MQ_PORT}"
      - "${RABBIT_MGMT_PORT}:${RABBIT_INTERNAL_MGMT_PORT}"
      - "${RABBIT_STOMP_PORT}:${RABBIT_INTERNAL_STOMP_PORT}"
      - "${RABBIT_PROM_PORT:-15692}:${RABBIT_INTERNAL_PROM_PORT:-15692}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- ELK STACK ---

  elasticsearch:
    <<: *base-service
    profiles: [ "observability" ]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${ELASTIC_XPACK_SECURITY_ENABLED}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    mem_limit: ${ES_MEM_LIMIT}
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status" ]
      interval: 10s
      timeout: 5s
      retries: 10

  logstash:
    <<: *base-service
    profiles: [ "observability" ]
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: logstash
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS}
    ports:
      - "${LOGSTASH_PORT}:5044"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9600" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kibana:
    <<: *base-service
    profiles: [ "observability" ]
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: ${ELASTIC_XPACK_SECURITY_ENABLED}
      NODE_OPTIONS: ${KIBANA_NODE_OPTIONS}
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'" ]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch-setup:
    <<: [*base-service, *setup]
    profiles: [ "observability" ]
    container_name: elasticsearch-setup
    volumes:
      - ./elk/elasticsearch:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana-setup:
    <<: [*base-service, *setup]
    profiles: [ "observability" ]
    container_name: kibana-setup
    volumes:
      - ./elk/kibana:/setup:ro
    depends_on:
      kibana:
        condition: service_healthy

  # --- FILEBEAT (Docker logs of the DB VM → Logstash in cluster, K8s mode only).
  # NOT a duplicate of Fluent Bit: filebeat ships /var/lib/docker/containers
  # from the VM host, fluent-bit (k8s/observability/fluentbit/) ships pod logs
  # inside the cluster. Different sources, one Logstash pipeline.

  filebeat:
    <<: *base-service
    profiles: [ "filebeat" ]
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION}
    container_name: filebeat
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOGSTASH_HOST: ${LOGSTASH_HOST:-}
    command: [ "--strict.perms=false" ]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- MONITORING ---

  prometheus:
    <<: *base-service
    profiles: [ "observability" ]
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Subpath for edge reverse-proxy (served as <ui>/prometheus/, not exposed directly)
      - '--web.route-prefix=/prometheus/'
      - '--web.external-url=/prometheus/'

  grafana:
    <<: *base-service
    profiles: [ "observability" ]
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Subpath for edge reverse-proxy (served as <ui>/grafana/, not exposed directly)
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      # Read-only anonymous access for lab demo; disable in real prod (use SSO/OAuth)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_controller_data:
  mongo_analytics_data:
  mongo_alerts_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  iot-network:
    driver: bridge
