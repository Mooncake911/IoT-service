# Composite: Node.js + npm ci for dashboard jobs.
# Assumes the caller already did actions/checkout (with submodules for the
# dashboard). Replaces duplicated setup-node + npm ci blocks in ci.yml.
name: setup-node-dashboard
description: Checkout code and set up Node.js with dashboard dependencies installed

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: iot-dashboard/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: iot-dashboard
      # --ignore-scripts blocks lifecycle scripts of transitive deps (Sonar).
      # Safe here: esbuild/vite ship platform binaries via optionalDependencies.
      run: npm ci --ignore-scripts
