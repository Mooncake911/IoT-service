# NOTE: datasource content mirrors monitoring/grafana/provisioning/datasources/datasource.yml
# (compose). Keep both in sync; uid 'prometheus' is referenced by dashboard JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: iot
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090/prometheus/
        isDefault: true
        editable: false
