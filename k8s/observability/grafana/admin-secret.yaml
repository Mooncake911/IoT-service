# Lab-default Grafana admin credentials.
# Committed for local/minikube convenience only. For shared/cloud use,
# override at deploy time (kubectl create secret generic grafana-admin
# --from-literal=... --dry-run=client -o yaml | kubectl apply -f -);
# real prod must use vault/SSO, not this file.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: iot
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
