# MongoDB backup tasks shared by deploy-vm.yml (before deploy) and
# backup.yml (standalone, used by cd-destroy.yml before VM wipe).
# Requires: deploy_dir, env_file (stat of {{ deploy_dir }}/.env),
# backup_bucket_name, backup_storage_access_key, backup_storage_secret_key.
# Facts set: mongo_user, mongo_pass (when .env exists).

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}/backups"
    state: directory
    mode: "0755"

- name: Get running MongoDB containers
  ansible.builtin.shell: |
    docker ps --filter "name=mongodb" --format "{{ '{{.Names}}' }}"
  register: mongodb_containers
  changed_when: false
  when: env_file.stat.exists

- name: Read MongoDB username from .env
  ansible.builtin.shell: |
    grep '^MONGO_USER=' "{{ deploy_dir }}/.env" | cut -d '=' -f2
  register: mongo_user_raw
  when: env_file.stat.exists
  changed_when: false

- name: Read MongoDB password from .env
  ansible.builtin.shell: |
    grep '^MONGO_PASS=' "{{ deploy_dir }}/.env" | cut -d '=' -f2
  register: mongo_pass_raw
  when: env_file.stat.exists
  changed_when: false

- name: Set MongoDB credentials as facts
  ansible.builtin.set_fact:
    mongo_user: "{{ mongo_user_raw.stdout | trim }}"
    mongo_pass: "{{ mongo_pass_raw.stdout | trim }}"
  when: env_file.stat.exists

- name: Dump each MongoDB container (with auth)
  ansible.builtin.shell: |
    docker exec {{ item }} mongodump \
      --archive --gzip \
      --username "{{ mongo_user }}" \
      --password "{{ mongo_pass }}" \
      --authenticationDatabase admin \
      > "{{ deploy_dir }}/backups/{{ item }}_{{ ansible_facts['date_time']['iso8601_basic_short'] }}.archive"
  loop: "{{ mongodb_containers.stdout_lines }}"
  when:
    - env_file.stat.exists
    - mongodb_containers.stdout_lines | length > 0
    - mongo_user != ''
    - mongo_pass != ''
  register: dump_results
  changed_when: true

- name: Upload MongoDB backups to Yandex Object Storage
  ansible.builtin.shell: |
    docker run --rm \
      -v "{{ deploy_dir }}/backups:/backups" \
      -e MC_HOST_s3="https://{{ backup_storage_access_key }}:{{ backup_storage_secret_key }}@storage.yandexcloud.net" \
      minio/mc:latest \
      cp --recursive /backups/ s3/{{ backup_bucket_name }}/backups/
  when:
    - env_file.stat.exists
    - backup_bucket_name | default('') != ''
    - backup_storage_access_key | default('') != ''
    - backup_storage_secret_key | default('') != ''
    - mongodb_containers.stdout_lines | length > 0
    - dump_results is defined
  register: upload_result
  failed_when: false
  changed_when: upload_result.rc == 0

- name: Warn if backup upload failed
  ansible.builtin.debug:
    msg: >-
      MongoDB backup upload to S3 failed (rc={{ upload_result.rc }}).
      Deployment will continue. Check S3 permissions (bucket ACL grant +
      kms.keys.encrypterDecrypter role for the storage SA) and re-run
      terraform apply if the bucket was recently provisioned.
      stderr: {{ upload_result.stderr | default('') | truncate(300) }}
  when:
    - upload_result is defined
    - upload_result.rc is defined
    - upload_result.rc != 0

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}/scripts"
    state: directory
    mode: "0755"

- name: Template daily backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ deploy_dir }}/scripts/backup.sh"
    mode: "0755"
  when:
    - backup_bucket_name | default('') != ''
    - backup_storage_access_key | default('') != ''
    - backup_storage_secret_key | default('') != ''

- name: Schedule daily MongoDB backup cron job
  ansible.builtin.cron:
    name: "Daily MongoDB backup"
    minute: "0"
    hour: "2"
    job: "/bin/bash {{ deploy_dir }}/scripts/backup.sh >> {{ deploy_dir }}/backups/backup.log 2>&1"
  when:
    - backup_bucket_name | default('') != ''
    - backup_storage_access_key | default('') != ''
    - backup_storage_secret_key | default('') != ''
