name: CD VM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (deploy or rollback)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      tag:
        description: "Target tag to deploy/rollback (leave empty to use commit SHA/previous version)"
        required: false
        default: ""
      run_terraform:
        description: "Run Terraform apply before deploy?"
        required: true
        default: false
        type: boolean
      enable_observability:
        description: "Deploy observability stack (ELK + Prometheus + Grafana)?"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Yandex Cloud VM
    runs-on: ubuntu-latest
    # All cloud credentials enter scripts via environment (never inline
    # ${{ secrets.* }} in run: blocks — Sonar flags that as a hotspot).
    env:
      YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mint ephemeral S3 backend keys
        uses: ./.github/actions/ephemeral-s3-keys
        with:
          operation: mint
          yc-sa-key-json: ${{ secrets.YC_SA_KEY_JSON }}
          yc-cloud-id: ${{ secrets.YC_CLOUD_ID }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}

      - name: Parse inputs & set environment
        run: |
          TAG_INPUT="${{ github.event.inputs.tag }}"
          TAG_SOURCE="explicit input"
          if [ -z "$TAG_INPUT" ]; then
            # Default to the git-pinned tag from k8s/overlays so VM and K8s
            # deploy the same version unless overridden explicitly.
            PINNED="$(grep -rhE '^[[:space:]]*newTag: ' k8s/overlays/*/kustomization.yaml 2>/dev/null | sort -u || true)"
            if [ "$(printf '%s\n' "$PINNED" | wc -l)" -eq 1 ] && [ -n "$PINNED" ]; then
              TAG_INPUT="$(printf '%s' "$PINNED" | sed -E 's/^[[:space:]]*newTag: //')"
              TAG_SOURCE="git pin"
            else
              TAG_INPUT="${{ github.sha }}"
              TAG_SOURCE="commit SHA (no single pinned tag found)"
            fi
          fi
          {
            echo "ACTION=${{ github.event.inputs.action }}"
            echo "TAG=$TAG_INPUT"
            echo "RUN_TERRAFORM=${{ github.event.inputs.run_terraform }}"
            echo "ENABLE_OBSERVABILITY=${{ github.event.inputs.enable_observability }}"
          } >> "$GITHUB_ENV"
          echo "Deploying tag: $TAG_INPUT ($TAG_SOURCE)"

      # Always installed: the backup-details step below needs the terraform
      # binary for state outputs even when run_terraform=false.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Run Terraform Apply (base)
        if: ${{ env.RUN_TERRAFORM == 'true' }}
        uses: ./.github/actions/terraform-stack
        with:
          stack: base
          operation: apply
          yc-sa-key-json: ${{ secrets.YC_SA_KEY_JSON }}
          yc-cloud-id: ${{ secrets.YC_CLOUD_ID }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}
          backend-access-key: ${{ env.S3_ACCESS_KEY_ID }}
          backend-secret-key: ${{ env.S3_SECRET_ACCESS_KEY }}

      - name: Run Terraform Apply (vm)
        if: ${{ env.RUN_TERRAFORM == 'true' }}
        uses: ./.github/actions/terraform-stack
        with:
          stack: vm
          operation: apply
          yc-sa-key-json: ${{ secrets.YC_SA_KEY_JSON }}
          yc-cloud-id: ${{ secrets.YC_CLOUD_ID }}
          yc-folder-id: ${{ secrets.YC_FOLDER_ID }}
          ssh-public-key: ${{ secrets.SSH_PUBLIC_KEY }}
          backend-access-key: ${{ env.S3_ACCESS_KEY_ID }}
          backend-secret-key: ${{ env.S3_SECRET_ACCESS_KEY }}

      - name: Determine VM IP
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "${{ vars.VM_IP }}" ]; then
            echo "VM_IP=${{ vars.VM_IP }}" >> "$GITHUB_ENV"
            echo "VM_INTERNAL_IP=${{ vars.VM_INTERNAL_IP }}" >> "$GITHUB_ENV"
          else
            cd infra/terraform/vm
            if [ ! -d ".terraform" ]; then
              terraform init -input=false \
                -backend-config="access_key=$S3_ACCESS_KEY_ID" \
                -backend-config="secret_key=$S3_SECRET_ACCESS_KEY"
            fi
            IP=$(terraform output -raw vm_public_ip)
            echo "VM_IP=$IP" >> "$GITHUB_ENV"
            INTERNAL=$(terraform output -raw vm_internal_ip 2>/dev/null || echo "10.10.0.100")
            echo "VM_INTERNAL_IP=$INTERNAL" >> "$GITHUB_ENV"
          fi

      - name: Get Backup Storage Details from Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -d "infra/terraform/vm/.terraform" ]; then
            cd infra/terraform/vm
            terraform init -input=false \
              -backend-config="access_key=$S3_ACCESS_KEY_ID" \
              -backend-config="secret_key=$S3_SECRET_ACCESS_KEY"
            cd ../../..
          fi
          BACKUP_BUCKET=$(cd infra/terraform/vm && terraform output -raw backup_bucket_name 2>/dev/null || echo "")
          BACKUP_ACCESS_KEY=$(cd infra/terraform/vm && terraform output -raw backup_storage_access_key 2>/dev/null || echo "")
          BACKUP_SECRET_KEY=$(cd infra/terraform/vm && terraform output -raw backup_storage_secret_key 2>/dev/null || echo "")

          if [ -n "$BACKUP_SECRET_KEY" ]; then
            echo "::add-mask::$BACKUP_SECRET_KEY"
          fi
          if [ -n "$BACKUP_ACCESS_KEY" ]; then
            echo "::add-mask::$BACKUP_ACCESS_KEY"
          fi

          {
            echo "BACKUP_BUCKET=$BACKUP_BUCKET"
            echo "BACKUP_ACCESS_KEY=$BACKUP_ACCESS_KEY"
            echo "BACKUP_SECRET_KEY=$BACKUP_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Set up SSH and inventory
        uses: ./.github/actions/setup-ssh-vm
        with:
          vm-ip: ${{ env.VM_IP }}
          ssh-user: ubuntu
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Ansible
        uses: ./.github/actions/setup-ansible

      - name: Log in to GHCR for image checks
        if: env.ACTION == 'deploy'
        uses: ./.github/actions/docker-login-ghcr
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure container images exist for deploy tag
        if: env.ACTION == 'deploy'
        run: |
          set -euo pipefail
          OWNER_LC="${OWNER,,}"
          TAG="${{ env.TAG }}"
          services=(iot-controller iot-analytics iot-alerts iot-data-gateway iot-data-simulator iot-dashboard-ui iot-rabbitmq)

          for svc in "${services[@]}"; do
            image="ghcr.io/${OWNER_LC}/iot-service/${svc}"
            if docker buildx imagetools inspect "${image}:${TAG}" >/dev/null 2>&1; then
              echo "Image ${image}:${TAG} already exists"
              continue
            fi
            echo "Tag ${TAG} missing for ${svc}, retagging from latest..."
            docker buildx imagetools create -t "${image}:${TAG}" "${image}:latest"
          done
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Run Ansible Docker installation
        working-directory: infra/ansible
        run: |
          ansible-playbook playbooks/install-docker.yml -i inventory.ini

      - name: Run Ansible Application Deployment
        working-directory: infra/ansible
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ansible-playbook playbooks/deploy-vm.yml -i inventory.ini \
            --extra-vars "app_version=${{ env.TAG }} registry_username=${{ github.actor }} registry_password=$REGISTRY_PASSWORD github_owner=${{ github.repository_owner }} deploy_action=${{ env.ACTION }} enable_observability=${{ env.ENABLE_OBSERVABILITY }} backup_bucket_name=${{ env.BACKUP_BUCKET }} backup_storage_access_key=${{ env.BACKUP_ACCESS_KEY }} backup_storage_secret_key=${{ env.BACKUP_SECRET_KEY }}"

      # ============================================================
      # VM POST-DEPLOY
      # ============================================================
      - name: Post-deploy verification of running containers
        run: |
          echo "Listing active docker containers on target VM..."
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.VM_IP }} "docker ps --format 'table {{.Names}}\t{{.Status}}'"

          RUNNING_COUNT=$(ssh -o StrictHostKeyChecking=no ubuntu@${{ env.VM_IP }} "docker ps --filter status=running -q | wc -l")

          if [ "${{ env.ENABLE_OBSERVABILITY }}" = "true" ]; then
            EXPECTED=15
          else
            EXPECTED=10
          fi

          echo "Running containers count: $RUNNING_COUNT"
          echo "Expected containers count: $EXPECTED"

          if [ "$RUNNING_COUNT" -lt "$EXPECTED" ]; then
            echo "ERROR: Some containers did not start correctly! Total running containers ($RUNNING_COUNT) is less than expected ($EXPECTED)."
            exit 1
          fi

      - name: Smoke-check gateway after VM deploy
        # NOTE (Sonar clear-text hotspot): plain HTTP is intentional here —
        # these are internal actuator healthchecks, services expose no TLS
        # endpoint. Review as Safe in SonarCloud UI.
        env:
          GATEWAY_BASE_URL: http://${{ env.VM_IP }}:8085
          DASHBOARD_BASE_URL: http://${{ env.VM_IP }}:8501
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${GATEWAY_BASE_URL}/api/v1/analytics/status" >/dev/null; then
              echo "Gateway OK"
              break
            fi
            echo "Waiting for gateway (attempt $i/30)..."
            sleep 10
          done
          chmod +x scripts/smoke-check.sh
          ./scripts/smoke-check.sh "${GATEWAY_BASE_URL}" "${DASHBOARD_BASE_URL}"

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Deployment summary"
            echo ""
            echo "- Tag: \`${{ env.TAG }}\`"
            echo "- Gateway: http://${{ env.VM_IP }}:8085"
            echo "- Dashboard: http://${{ env.VM_IP }}:8501"
            if [ "${{ env.ENABLE_OBSERVABILITY }}" = "true" ]; then
              echo "- Grafana: http://${{ env.VM_IP }}:8501/grafana/"
              echo "- Prometheus: http://${{ env.VM_IP }}:8501/prometheus/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify via Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          workflow: CD VM
          details: "action=${{ env.ACTION }} tag=${{ env.TAG }}"
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Revoke ephemeral S3 backend keys
        if: always()
        uses: ./.github/actions/ephemeral-s3-keys
        with:
          operation: revoke
